spring:
  application:
    name: cinema-billetterie
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cinema?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=LOCAL}
    username: ${DB_USERNAME:cinema}
    password: ${DB_PASSWORD:cinema}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        type:
          java_time_use_direct_jdbc: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

logging:
  level:
    root: INFO
    fr.butinfo.cinema: INFO
