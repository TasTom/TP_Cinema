<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Les séances')}"></head><body><a class="skip-link" href="#contenu">Aller au contenu</a><header th:replace="~{fragments/layout :: header}"></header><main id="contenu" class="container"><div th:replace="~{fragments/layout :: messages}"></div><div class="page-intro"><p class="section-intro">Votre rendez-vous avec le cinéma</p><h1 th:text="${film != null ? film.titre : 'À quelle séance venez-vous ?'}">Les séances</h1><p class="lead">Une date, un film, votre place. Le plus difficile, c’est de choisir.</p></div>
<form class="filters" method="get" th:action="@{/seances}" role="search"><input type="hidden" name="filmId" th:if="${filmId != null}" th:value="${filmId}"><div class="field"><label for="du">À partir du</label><input type="date" id="du" name="du" th:value="${du != null ? du.toString() : ''}"></div><div class="field"><label for="au">Jusqu’au</label><input type="date" id="au" name="au" th:value="${au != null ? au.toString() : ''}"></div><button type="submit" class="btn btn-primary">Afficher les séances</button><a class="btn btn-ghost" th:href="@{/seances}">Tout le planning</a></form>
<div th:if="${#lists.isEmpty(seances)}" class="empty"><h2>Aucune séance à ces dates.</h2><p>Élargissez la période ou consultez le planning complet.</p><a class="btn btn-outline" th:href="@{/seances}">Réinitialiser les dates</a></div><div class="screening-list"><th:block th:each="seance : ${seances}"><article th:replace="~{fragments/seance :: ligne(${seance})}"></article></th:block></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
