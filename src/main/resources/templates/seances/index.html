<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Séances')}"></head>
<body>
<a class="skip-link" href="#contenu">Aller au contenu</a>
<header th:replace="~{fragments/layout :: header}"></header>

<main id="contenu" class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>

    <p class="eyebrow">Planning</p>
    <h1 th:if="${film == null}">Les séances</h1>
    <h1 th:if="${film != null}">
        Séances pour <span th:text="${film.titre}">Film</span>
    </h1>
    <p class="lead">Choisissez une date et réservez votre place en quelques secondes.</p>

    <form class="filters" method="get" th:action="@{/seances}" role="search">
        <input type="hidden" name="filmId" th:if="${filmId != null}" th:value="${filmId}">
        <div class="field">
            <label for="du">Du</label>
            <input type="date" id="du" name="du" th:value="${du != null ? du.toString() : ''}">
        </div>
        <div class="field">
            <label for="au">Au</label>
            <input type="date" id="au" name="au" th:value="${au != null ? au.toString() : ''}">
        </div>
        <button type="submit" class="btn btn-primary">Filtrer</button>
        <a class="btn btn-ghost" th:href="@{/seances}">Réinitialiser</a>
    </form>

    <div th:if="${#lists.isEmpty(seances)}" class="empty">
        Aucune séance ne correspond à ces critères.
    </div>
    <div th:unless="${#lists.isEmpty(seances)}" class="screening-list">
        <article class="screening" th:each="seance : ${seances}">
            <div class="screening-date">
                <span th:text="${@format.date(seance.debut)}">05/11/2026</span>
                <strong th:text="${@format.heure(seance.debut)}">20:00</strong>
            </div>
            <div class="screening-info">
                <h3 th:text="${seance.filmTitre}">Titre du film</h3>
                <p class="muted">
                    <span th:text="${seance.salleNom}">Salle</span>
                    <span aria-hidden="true"> · </span>
                    <span th:text="${@format.monnaie(seance.prixUnitaire)}">9,90 €</span>
                    <span aria-hidden="true"> · </span>
                    <span th:text="${seance.capaciteSalle} + ' places'">120 places</span>
                </p>
            </div>
            <div class="screening-action">
                <span class="badge"
                      th:classappend="${seance.placesRestantes == 0 ? 'badge-muted' : 'badge-success'}"
                      th:text="${seance.placesRestantes == 0 ? 'Complet' : seance.placesRestantes + ' places'}">
                    12 places
                </span>
                <a th:if="${seance.placesRestantes > 0}" class="btn btn-primary btn-small"
                   th:href="@{/reservation/{id}(id=${seance.id})}">Réserver</a>
                <span th:if="${seance.placesRestantes == 0}" class="btn btn-small" aria-disabled="true">
                    Complet
                </span>
            </div>
        </article>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
