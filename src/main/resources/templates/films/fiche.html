<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${film.titre})}"></head><body><a class="skip-link" href="#contenu">Aller au contenu</a><header th:replace="~{fragments/layout :: header}"></header><main id="contenu">
 <div class="detail-banner"><img th:if="${film.panorama != null}" th:src="${film.panorama}" alt="" width="1280" height="720" fetchpriority="high"><div class="hero-shade"></div></div>
 <section class="container film-detail"><div class="detail-poster"><img th:if="${film.affiche != null}" th:src="${film.affiche}" th:alt="${'Affiche de ' + film.titre}" width="400" height="600"><div th:unless="${film.affiche != null}" class="poster-fallback" th:text="${film.titre}"></div></div><div class="detail-copy"><a class="breadcrumb" th:href="@{/films}">Tous les films</a><div th:replace="~{fragments/layout :: messages}"></div><h1 th:text="${film.titre}">Titre</h1><div class="hero-meta"><span th:text="${film.genre ?: 'Cinéma'}"></span><span th:text="${film.dureeMinutes} + ' minutes'"></span><span th:if="${film.anneeSortie != null}" th:text="${film.anneeSortie}"></span></div><p class="director" th:if="${!#strings.isEmpty(film.realisateur)}">Un film de <strong th:text="${film.realisateur}"></strong></p><h2>L’histoire</h2><p class="synopsis" th:text="${!#strings.isEmpty(film.synopsis) ? film.synopsis : 'Une nouvelle histoire à découvrir dans nos salles. Consultez les séances pour préparer votre venue.'}"></p><a class="btn btn-primary" href="#seances-film" th:if="${!#lists.isEmpty(seances)}">Choisir une séance</a><a class="btn btn-outline" th:if="${estAdmin or estProgrammateur}" th:href="@{/admin/seances}">Programmer une séance</a><small class="source-note" th:if="${film.sourceExterne != null}" th:text="${film.sourceExterne == 'GHIBLI' ? 'Informations : Studio Ghibli API. Le synopsis original peut être en anglais.' : 'Informations : TMDB.'}"></small></div></section>
 <section id="seances-film" class="container detail-screenings"><div class="section-head"><h2>Quand le voir ?</h2></div><div th:if="${#lists.isEmpty(seances)}" class="empty"><h3>Ce film n’a pas encore de séance programmée.</h3><p>Retrouvez les films actuellement projetés dans le planning.</p><a class="btn btn-primary" th:href="@{/seances}">Voir les séances disponibles</a></div><div class="screening-list"><th:block th:each="seance : ${seances}"><article th:replace="~{fragments/seance :: ligne(${seance})}"></article></th:block></div></section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
